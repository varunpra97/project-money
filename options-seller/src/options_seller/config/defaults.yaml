# Shared strategy defaults (overridable via CLI or config file)
dte:
  min: 21
  max: 45
  prefer_csp_cc_min: 30
  prefer_csp_cc_max: 45
  prefer_spread_min: 20
  prefer_spread_max: 45

short_delta:
  min: 0.15
  max: 0.30
  default_min: 0.20
  default_max: 0.25
  iron_condor_target: 0.16

iv_rank:
  min: 30

liquidity:
  min_open_interest: 100
  max_bid_ask_spread: 0.15  # absolute dollars, or ratio if < 1 relative to mid

earnings:
  skip_within_days: 7

credit_spreads:
  target_credit_fraction_of_width: 0.333
  # max_loss = width - credit

prefer_defined_risk: false
cash_threshold_for_defined_risk: 5000  # if cash_available below this, prefer spreads over naked CSP

risk:
  max_portfolio_risk_usd: 50000
  soft_warn_pct: 0.8
  auto_trim: true
