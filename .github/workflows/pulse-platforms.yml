name: Pulse platform checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pulse:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: python -m pip install -r options-seller/api/requirements.txt
      - run: python -m pip install "pytest>=8,<10"
      - name: Backend regression and TCP latency checks
        working-directory: options-seller
        shell: bash
        run: |
          export PYTHONPATH="$(pwd)/src"
          python -m unittest discover -s tests/unit -p 'test_p*.py' -v
          python -m unittest discover -s tests/integration -p test_live_latency.py -v
          python -m pytest tests/unit/test_paper_executor.py tests/unit/test_paper_positions.py tests/unit/test_strategies.py tests/unit/test_scanner_schema.py -q
      - run: npm ci
        working-directory: mobile-app
      - run: npm test
        working-directory: mobile-app
      - run: npm run build
        working-directory: mobile-app
      - run: npx tsc --noEmit
        working-directory: mobile-app
      - name: Native client freshness and compatibility checks
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcrun swiftc -parse-as-library ios-app/Pulse/Config.swift ios-app/Pulse/Models.swift ios-app/Pulse/APIClient.swift ios-app/tests/ClientContractChecks.swift -o "$RUNNER_TEMP/pulse-client-contract"
          "$RUNNER_TEMP/pulse-client-contract"
